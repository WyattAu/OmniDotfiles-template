# Gates: shellcheck + shfmt + bats. The dry-run apply matrix runs in ubuntu
# AND arch containers — CachyOS parity without the hardware (ADR-0001).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 1 * *" # monthly bitrot

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt bats && curl -sSfL https://get.chezmoi.io | sh -s -- -b /usr/local/bin
      - run: make ci

  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - run: pacman -Syu --noconfirm shellcheck shfmt bats curl
      - run: curl -sSfL https://get.chezmoi.io | sh -s -- -b /usr/local/bin
      - run: make ci

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: ./scripts/check-contract.sh

  # Loop 2: performance budget. Advisory for one loop, then graduates to a
  # blocking gate (LOOP.md graduation policy). Same scripts/ commands the
  # developer runs locally - never a CI-only measurement path.
  perf:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt bats && curl -sSfL https://get.chezmoi.io | sh -s -- -b /usr/local/bin
      - run: make bench

  # Loop 3: determinism verification. Advisory for one loop, then blocking where
  # the toolchain is deterministic (LOOP.md graduation policy). Same
  # scripts/ command a developer runs locally.
  repro:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt bats && curl -sSfL https://get.chezmoi.io | sh -s -- -b /usr/local/bin
      - run: make repro
